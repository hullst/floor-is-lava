<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=4">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png?v=4">
  <link rel="shortcut icon" href="favicon.ico?v=4">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Floor is Lava! 🌋</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Boogaloo&family=Fredoka+One&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gray: #8B8B8B;
    --yellow: #FFD600;
    --red: #E53935;
    --blue: #1E88E5;
    --green: #43A047;
    --lava: #FF6D00;
  }

  body {
    background: #1a0800;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Fredoka One', cursive;
    overflow: hidden;
    position: relative;
  }

  /* Lava bubbles background */
  .lava-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .bubble {
    position: absolute;
    bottom: -80px;
    border-radius: 50%;
    opacity: 0.18;
    animation: rise linear infinite;
  }

  @keyframes rise {
    to { transform: translateY(-110vh) scale(1.3); opacity: 0; }
  }

  .title {
    position: relative;
    z-index: 2;
    color: var(--yellow);
    font-size: clamp(2.2rem, 6vw, 4rem);
    letter-spacing: 2px;
    text-shadow: 0 0 30px var(--lava), 0 4px 0 #7c2000;
    margin-bottom: 10px;
    text-align: center;
  }

  .subtitle {
    position: relative;
    z-index: 2;
    color: #ff9966;
    font-family: 'Boogaloo', cursive;
    font-size: clamp(1rem, 3vw, 1.4rem);
    margin-bottom: 40px;
    opacity: 0.85;
  }

  /* Spinner wheel */
  .spinner-container {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
  }

  .wheel-wrap {
    position: relative;
    width: min(72vw, 420px);
    height: min(72vw, 420px);
  }

  /* Pointer */
  .pointer {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    width: 0;
    height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-top: 48px solid white;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
  }

  canvas#wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    box-shadow: 0 0 0 10px #3d1500, 0 0 0 14px #7c3000, 0 0 60px rgba(255,109,0,0.6), 0 20px 60px rgba(0,0,0,0.5);
    display: block;
  }

  /* Center hub */
  .hub {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 30%, #ddd 100%);
    box-shadow: 0 0 0 6px #555, 0 4px 16px rgba(0,0,0,0.5);
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }

  /* Spin button */
  .spin-btn {
    background: linear-gradient(135deg, var(--lava), #ff3300);
    color: white;
    border: none;
    border-radius: 60px;
    padding: 22px 64px;
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.4rem, 4vw, 2rem);
    cursor: pointer;
    box-shadow: 0 8px 0 #7c1500, 0 12px 30px rgba(0,0,0,0.4);
    transform: translateY(0);
    transition: transform 0.1s, box-shadow 0.1s;
    letter-spacing: 1px;
    position: relative;
    z-index: 2;
  }

  .spin-btn:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 #7c1500, 0 4px 14px rgba(0,0,0,0.3);
  }

  .spin-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* Result banner */
  .result {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
  }

  .result.show {
    opacity: 1;
    pointer-events: all;
  }

  .result-card {
    text-align: center;
    padding: 50px 60px;
    border-radius: 32px;
    border: 6px solid rgba(255,255,255,0.2);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    transform: scale(0.7);
    transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
    max-width: 90vw;
  }

  .result.show .result-card {
    transform: scale(1);
  }

  .result-emoji {
    font-size: clamp(4rem, 12vw, 7rem);
    display: block;
    margin-bottom: 10px;
    animation: bounce 0.6s ease infinite alternate;
  }

  @keyframes bounce {
    to { transform: translateY(-16px); }
  }

  .result-color-name {
    font-size: clamp(2rem, 7vw, 4rem);
    color: white;
    text-shadow: 0 4px 14px rgba(0,0,0,0.4);
    display: block;
  }

  .result-tagline {
    font-family: 'Boogaloo', cursive;
    font-size: clamp(1rem, 3.5vw, 1.6rem);
    color: rgba(255,255,255,0.8);
    margin-top: 8px;
    display: block;
  }

  .tap-dismiss {
    font-family: 'Boogaloo', cursive;
    font-size: 1rem;
    color: rgba(255,255,255,0.4);
    margin-top: 24px;
    display: block;
  }
</style>
</head>
<body>

<div class="lava-bg" id="lavaBg"></div>

<div class="title">🌋 FLOOR IS LAVA!</div>
<div class="subtitle">spin to find your safe color</div>

<div class="spinner-container">
  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel"></canvas>
    <div class="hub">🔥</div>
  </div>
  <button class="spin-btn" id="spinBtn" onclick="spin()">SPIN!</button>
</div>

<div class="result" id="result" onclick="dismissResult()">
  <div class="result-card" id="resultCard">
    <span class="result-emoji" id="resultEmoji">🟡</span>
    <span class="result-color-name" id="resultName">YELLOW</span>
    <span class="result-tagline" id="resultTagline">Find something yellow — fast!</span>
    <span class="tap-dismiss">tap anywhere to dismiss</span>
  </div>
</div>

<script>
  // Lava bubbles
  const bg = document.getElementById('lavaBg');
  const colors = ['#ff4500','#ff6d00','#ff3300','#ff8c00'];
  for(let i=0;i<18;i++){
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 40 + Math.random()*120;
    b.style.cssText = `width:${size}px;height:${size}px;background:${colors[i%4]};left:${Math.random()*100}%;animation-duration:${6+Math.random()*10}s;animation-delay:${Math.random()*8}s;`;
    bg.appendChild(b);
  }

  // Wheel setup
  const segments = [
    { label: 'GRAY',   color: '#8B8B8B', emoji: '🪨', tagline: 'Find something gray — quick!' },
    { label: 'YELLOW', color: '#FFD600', emoji: '⭐', tagline: 'Find something yellow — fast!' },
    { label: 'RED',    color: '#E53935', emoji: '🍎', tagline: 'Find something red — hurry!' },
    { label: 'BLUE',   color: '#1E88E5', emoji: '💧', tagline: 'Find something blue — go!' },
    { label: 'GREEN',  color: '#43A047', emoji: '🌿', tagline: 'Find something green — now!' },
    { label: 'GRAY',   color: '#8B8B8B', emoji: '🪨', tagline: 'Find something gray — quick!' },
    { label: 'YELLOW', color: '#FFD600', emoji: '⭐', tagline: 'Find something yellow — fast!' },
    { label: 'RED',    color: '#E53935', emoji: '🍎', tagline: 'Find something red — hurry!' },
    { label: 'BLUE',   color: '#1E88E5', emoji: '💧', tagline: 'Find something blue — go!' },
    { label: 'GREEN',  color: '#43A047', emoji: '🌿', tagline: 'Find something green — now!' },
  ];

  const n = segments.length;
  const arc = (2 * Math.PI) / n;
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  let currentAngle = 0;
  let spinning = false;

  function resize() {
    const size = canvas.parentElement.clientWidth;
    canvas.width = size;
    canvas.height = size;
    drawWheel(currentAngle);
  }

  function drawWheel(angle) {
    const cx = canvas.width / 2, cy = canvas.height / 2, r = cx - 4;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let i=0;i<n;i++){
      const start = angle + i * arc;
      const end = start + arc;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,r,start,end);
      ctx.closePath();
      ctx.fillStyle = segments[i].color;
      ctx.fill();
      // Slice border
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 3;
      ctx.stroke();
      // Label
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(start + arc/2);
      ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.font = `bold ${Math.floor(r*0.11)}px 'Fredoka One', cursive`;
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 6;
      ctx.fillText(segments[i].label, r * 0.88, r * 0.06);
      ctx.restore();
    }
    // Outer ring
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,2*Math.PI);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 6;
    ctx.stroke();
  }

  function getWinner(angle) {
    // pointer is at top (3*PI/2 = -PI/2), find which segment it lands on
    const normalized = ((-angle - Math.PI/2) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI);
    const idx = Math.floor(normalized / arc) % n;
    return segments[idx];
  }

  function spin() {
    if(spinning) return;
    spinning = true;
    document.getElementById('spinBtn').disabled = true;

    const extraSpins = 5 + Math.floor(Math.random()*5);
    const randomAngle = Math.random() * 2 * Math.PI;
    const targetAngle = currentAngle + extraSpins * 2 * Math.PI + randomAngle;

    const duration = 3500 + Math.random()*1500;
    const startAngle = currentAngle;
    const startTime = performance.now();

    function easeOut(t) {
      return 1 - Math.pow(1-t, 4);
    }

    function animate(now) {
      const elapsed = now - startTime;
      const t = Math.min(elapsed / duration, 1);
      currentAngle = startAngle + (targetAngle - startAngle) * easeOut(t);
      drawWheel(currentAngle);

      if(t < 1) {
        requestAnimationFrame(animate);
      } else {
        currentAngle = targetAngle % (2*Math.PI);
        drawWheel(currentAngle);
        spinning = false;
        document.getElementById('spinBtn').disabled = false;
        showResult(getWinner(currentAngle));
      }
    }

    requestAnimationFrame(animate);
  }

  function showResult(seg) {
    const card = document.getElementById('resultCard');
    card.style.background = seg.color;
    // darken for gray
    const darken = seg.label === 'GRAY' ? 'rgba(0,0,0,0.3)' : 'rgba(0,0,0,0.15)';
    card.style.background = `linear-gradient(135deg, ${seg.color}, ${darken === 'rgba(0,0,0,0.3)' ? '#555' : seg.color+'cc'})`;
    document.getElementById('resultEmoji').textContent = seg.emoji;
    document.getElementById('resultName').textContent = seg.label;
    document.getElementById('resultTagline').textContent = seg.tagline;
    document.getElementById('result').classList.add('show');
  }

  function dismissResult() {
    document.getElementById('result').classList.remove('show');
  }

  window.addEventListener('resize', resize);
  resize();
</script>
</body>
</html>
